services:
 catalogdb:
    container_name: catalogdb
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=Catalog@123
      - POSTGRES_DB=catalogdb
    restart: always
    ports:
      - "5433:5432"
    volumes:
      - catalog_postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

 notificationdb:
    container_name: notificationdb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

 basketdb:
    container_name: basketdb
    restart: always
    ports:
      - "6379:6379" 
 
 discountdb:
    container_name: discountdb
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=Password@1
      - POSTGRES_DB=DiscountDb
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - discount_postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5
      
 orderdb:
    container_name: orderdb
    environment:
      SA_PASSWORD: "Dibakor46@"
      ACCEPT_EULA: "Y"
    restart: always
    ports:
      - "1433:1433"
    volumes:
      - orderdb-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'Rahul1234567' -Q 'select 1'"]
      interval: 10s
      timeout: 10s
      retries: 3
         
 identitydb:
    container_name: identitydb
    environment:
      SA_PASSWORD: "Dibakor46@"
      ACCEPT_EULA: "Y"
    restart: always
    ports:
      - "1434:1433"
    volumes:
      - identitydb-data:/var/opt/mssql  
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'Rahul1234567' -Q 'select 1'"]
      interval: 10s
      timeout: 10s
      retries: 3 

 rabbitmq:
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"

 pgadmin:
    container_name: pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@eCommerce.net
      - PGADMIN_DEFAULT_PASSWORD=Password@1
    restart: always
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/root/.pgadmin

 portainer:
    container_name: portainer
    restart: always
    ports:
      - "8080:8000"
      - "9090:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

 catalog:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - "ConnectionStrings__DefaultConnection=Host=catalogdb;Port=5433;Database=catalogdb;Username=admin;Password=Catalog@123;"
      - "Jwt__Key=super_secure_secret_key_1234567890!@#"
      - "Jwt__Issuer=ecommerce.identity"
      - "Jwt__Audience=ecommerce.clients"
      - "ElasticConfiguration__Uri=http://elasticsearch:9200" 
    depends_on:
      - catalogdb          
    ports:
      - "8000:8080"  

 basket:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - "CacheSettings__ConnectionString=basketdb:6379"
      - "GrpcSettings__DiscountUrl=http://discount:8080" 
      - "EventBusSettings__HostAddress=amqp://guest:guest@rabbitmq:5672/"
      - "ElasticConfiguration__Uri=http://elasticsearch:9200"
    depends_on:
      - basketdb
      - rabbitmq
    ports:
      - "8001:8080"

 discount:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - "ConnectionString__DefaultConnection=Server=discountdb;Host=discountdb;Port=5434;Database=discountdb;Username=admin;Password=Password@1;"
      - "Jwt__Key=super_secure_secret_key_1234567890!@#"
      - "Jwt__Issuer=ecommerce.identity"
      - "Jwt__Audience=ecommerce.clients"
      - "ElasticConfiguration__Uri=http://elasticsearch:9200"
    depends_on:
       - discountdb          
    ports:
      - "8007:8080"
 ordering:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - "ConnectionStrings__DefaultConnection=Server=ordeerdb,1433;Database=orderdb;User Id=sa;Password=Dibakor46@;TrustServerCertificate=True;"
      - "EventBusSettings__HostAddress=amqp://guest:guest@rabbitmq:5672/"
      - "ElasticConfiguration__Uri=http://elasticsearch:9200"
    depends_on:
      - orderdb          
      - rabbitmq          
    ports:
      - "8003:8080" 
 payment:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - "EventBusSettings__HostAddress=amqp://guest:guest@rabbitmq:5672/"
      - "ElasticConfiguration__Uri=http://elasticsearch:9200"
    ports:
      - "8004:8080"

 identity:
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - "ConnectionStrings__DefaultConnection=Server=identitydb;Database=identitydb;User Id=sa;Password=Dibakor46@;TrustServerCertificate=True;"
      - "Jwt__Key=super_secure_secret_key_1234567890!@#"
      - "Jwt__Issuer=ecommerce.identity"
      - "Jwt__Audience=ecommerce.clients"
    depends_on:
      - identitydb          
    ports: 
      - "8005:8080"

 notification:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - "ConnectionStrings__MongoDb=mongodb://127.0.0.1:27017"
      - "EventBusSettings__HostAddress=amqp://guest:guest@rabbitmq:5672/"
      - "ElasticConfiguration__Uri=http://elasticsearch:9200"
    depends_on:
      - notificationdb          
    ports: 
      - "8006:8080"

 ocelot.apigateway:
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - "Jwt__Key=super_secure_secret_key_1234567890!@#"
      - "Jwt__Issuer=ecommerce.identity"
      - "Jwt__Audience=ecommerce.clients"
    depends_on:
      - identity
      - catalog
      - basket
      - ordering
      - payment
      - discount
      - notification
    ports:
      - "8010:8080"      
 elasticsearch:
    container_name: elasticsearch
    environment:
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

 kibana:
    container_name: kibana
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    ports:
      - "5601:5601"           
